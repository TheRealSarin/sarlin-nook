name: Triage pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Check the pull request and merge it when everything is clean
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the base branch only
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the newest sarlin compiler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install-sarlin.sh "$RUNNER_TEMP/sarlin"

      - name: Fetch the published index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous
          if git fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" index:refs/remotes/origin/index 2>/dev/null; then
            git show origin/index:index.txt > previous/index.txt
          fi

      - name: Triage the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/triage.mjs --index previous/index.txt
